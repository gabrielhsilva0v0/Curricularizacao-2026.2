<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conhecimentos Gerais – Posição</title>
<link rel="stylesheet" href="styleMedio.css">
</head>
<body>
<div id="game">
  <span class="deco" style="left:-6px;top:70px">🌳</span>
  <span class="deco" style="right:-6px;top:90px">🌴</span>

  <header>
    <button class="round" id="back" title="Recomeçar">↩</button>
    <div class="pill">Posição (arrastar)</div>
    <div class="stars">⭐ <span id="score">0</span></div>
  </header>
  <div class="prog" id="prog"></div>
  <div class="bubble">
    <span class="mascots">🦉</span>
    <span id="q"></span>
    <button class="round" id="say" title="Ouvir">🔊</button>
    <span class="mascots">🦊</span>
  </div>
  <div id="scene">
    <div id="msg"></div>
    <div id="hint"></div>
  </div>

  <div id="end"><div class="card">
    <div class="big">🏆</div>
    <h1>Parabéns!</h1>
    <p style="font-size:20px">Você acertou tudo!<br>⭐ <b id="final">0</b> estrelas</p>
    <button class="btn" id="again">Jogar de novo</button>
  </div></div>

  <div id="start"><div class="card">
    <div style="font-size:60px">🦉 🦊</div>
    <h1>Bem-vindo!</h1>
    <p style="font-size:19px">Arraste o objeto para o lugar certo e ganhe estrelas!</p>
    <button class="btn" id="go">CONTINUAR</button>
  </div></div>
</div>

<script src="scriptMedio.js"></script>
</body>
</html>
